services:
  postgres:
    image: postgres:16
    container_name: mersad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mersad
      POSTGRES_USER: mersad
      POSTGRES_PASSWORD: mersad_dev_password
    ports:
      - "5433:5432"
    volumes:
      - mersad-postgres-data:/var/lib/postgresql/data

volumes:
  mersad-postgres-data:
